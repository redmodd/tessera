name: Bug report
description: Report a defect in Tessera
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Steps to reproduce, or a minimal repo / code sample.
        Note which export mode the issue affects (SCORM 1.2 / SCORM 2004 / cmi5 / web).
    validations:
      required: true
  - type: input
    id: tessera-version
    attributes:
      label: "@redmondd/tessera version"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: "e.g. 22.11.0"
    validations:
      required: true
  - type: input
    id: lms
    attributes:
      label: LMS / runtime (if applicable)
      placeholder: "e.g. Moodle 4.4, SCORM Cloud, Rustici Engine, browser only"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
