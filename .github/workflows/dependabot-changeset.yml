name: Dependabot changeset
on: pull_request

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dependabot-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v2
        id: meta

      - if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          manifests=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep '^packages/.*/package\.json$') || exit 0
          file=".changeset/dependabot-${PR_NUMBER}.md"
          [ -e "$file" ] && exit 0
          cat > "$file" <<'EOF'
          ---
          'tessera-learn': patch
          ---
          EOF
          printf '\n%s\n' "$PR_TITLE" >> "$file"
          for manifest in $manifests; do
            bumps=$(git diff -U0 "origin/${BASE_REF}...HEAD" -- "$manifest" | awk -F'"' '
              /^-[[:space:]]+"/ { gsub(/^[~^]/, "", $4); old[$2] = $4 }
              /^\+[[:space:]]+"/ { gsub(/^[~^]/, "", $4); new[$2] = $4 }
              END { for (n in new) if (n in old && old[n] != new[n]) print "- `" n "` " old[n] " → " new[n] }
            ' | sort)
            [ -n "$bumps" ] && printf '\n`%s`:\n\n%s\n' "$(basename "$(dirname "$manifest")")" "$bumps" >> "$file"
          done
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git add .changeset
          git diff --cached --quiet || git commit -m 'chore: add changeset for dependency bump'
          git push
