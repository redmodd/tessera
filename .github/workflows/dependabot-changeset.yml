name: Dependabot changeset
on: pull_request

permissions:
  contents: write

jobs:
  changeset:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v2
        id: meta

      # Dev-dependency bumps don't change published output, so no release needed.
      - if: contains(steps.meta.outputs.dependency-type, 'production')
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - if: contains(steps.meta.outputs.dependency-type, 'production')
        run: |
          cat > .changeset/dependabot-${{ github.event.pull_request.number }}.md <<EOF
          ---
          "tessera-learn": patch
          ---

          ${{ github.event.pull_request.title }}
          EOF
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git add .changeset
          git commit -m 'chore: add changeset for dependency bump'
          git push
