name: Dependabot changeset
on: pull_request

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dependabot-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: meta

      - if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          manifests=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep '^packages/.*/package\.json$') || exit 0
          for manifest in $manifests; do
            name=$(node -p "require('./$manifest').name")
            file=".changeset/dependabot-${PR_NUMBER}-${name}.md"
            [ -e "$file" ] && continue
            bumps=$(git diff -U0 "origin/${BASE_REF}...HEAD" -- "$manifest" | awk -F'"' '
              /^-[[:space:]]+"/ { gsub(/^[~^]/, "", $4); old[$2] = $4 }
              /^\+[[:space:]]+"/ { gsub(/^[~^]/, "", $4); new[$2] = $4 }
              END { for (n in new) if (n in old && old[n] != new[n]) print "- `" n "` " old[n] " → " new[n] }
            ' | sort)
            [ -z "$bumps" ] && continue
            printf -- '---\n'"'"'%s'"'"': patch\n---\n\n%s\n' "$name" "$bumps" > "$file"
          done
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git add .changeset
          git diff --cached --quiet || git commit -m 'chore: add changeset for dependency bump'
          git push
