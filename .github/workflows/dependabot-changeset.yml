name: Dependabot changeset
on: pull_request

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dependabot-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v2
        id: meta

      - if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" | grep -q '^packages/' || exit 0
          file=".changeset/dependabot-${PR_NUMBER}.md"
          cat > "$file" <<'EOF'
          ---
          'tessera-learn': patch
          ---
          EOF
          printf '\n%s\n' "$PR_TITLE" >> "$file"
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git add .changeset
          git diff --cached --quiet || git commit -m 'chore: add changeset for dependency bump'
          git push
