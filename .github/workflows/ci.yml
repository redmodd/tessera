name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Every job but CI skips on the release PR: it only bumps versions over a main
# commit, and CI checks that commit's push run instead. The head label, unlike
# the branch name, can't come from a fork.
jobs:
  static:
    name: Lint, types & format
    if: &not-release-pr github.event.pull_request.head.label != 'redmodd:changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc -p tests type-checks e2e specs that import tessera-learn's dist/.
      - run: pnpm build

      - run: pnpm check

  test:
    name: Build & test (Node ${{ matrix.node }})
    if: *not-release-pr
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:coverage

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.node }}
          path: |
            packages/*/coverage/
          retention-days: 7
          if-no-files-found: ignore

  playwright-version:
    name: Playwright version
    if: *not-release-pr
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lockfile.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - id: lockfile
        run: |
          v=$(sed -n "s/^  playwright-core@\(.*\):$/\1/p" pnpm-lock.yaml)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::expected one playwright-core version in pnpm-lock.yaml, got: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright e2e (${{ matrix.browser }})
    needs: playwright-version
    runs-on: ubuntu-latest
    # The image ships the browsers and their system packages; installing them
    # on the runner stalls for minutes when the Ubuntu apt mirror is slow.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  templates-e2e:
    name: Scaffold & build templates
    if: *not-release-pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter create-tessera test:templates

  changeset:
    name: Changeset present
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.label != 'redmodd:changeset-release/main' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm changeset status --since=origin/main

  # Required check: skipped matrix jobs never report their expanded names.
  ci:
    name: CI
    if: always()
    needs: [static, test, playwright-version, e2e, templates-e2e, changeset]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: Main's CI passed on the release PR's base
        if: github.event.pull_request.head.label == 'redmodd:changeset-release/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA" --jq '.parents[0].sha')
          run=$(gh run list -w ci.yml -e push -c "$base" -L 1 --json databaseId -q '.[0].databaseId')
          [[ -n "$run" ]] || { echo "::error::no CI push run for $base: the release PR must sit directly on a main commit"; exit 1; }
          gh run watch "$run" -i 30 --compact --exit-status
