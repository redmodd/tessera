name: Screen reader

# Not a required check: NVDA on hosted runners can be flaky. It also runs on
# PRs that change the check itself, since workflow_dispatch only works once the
# workflow is on main.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/screen-reader.yml
      - tests/screen-reader/**
      - tests/fixtures/screen-reader/**

permissions:
  contents: read

jobs:
  nvda:
    name: NVDA (Chromium, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium

      - uses: guidepup/setup-action@0.21.0

      - run: pnpm --filter tessera-learn build

      - run: pnpm exec playwright test -c tests/screen-reader/playwright.config.ts

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvda-phrases
          path: test-results/screen-reader/
          retention-days: 7
          if-no-files-found: ignore
