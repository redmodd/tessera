name: Screen reader

# Not a required check: NVDA on hosted runners can be flaky.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/screen-reader.yml
      - tests/screen-reader/**
      - tests/fixtures/screen-reader/**
      - packages/tessera-learn/src/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  nvda:
    name: NVDA (${{ matrix.browser }}, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Screen readers need a headed browser, so skip the headless shell.
      - run: pnpm exec playwright install --no-shell ${{ matrix.browser }}

      # Downloads the NVDA build that the installed @guidepup/guidepup expects.
      - run: pnpm dlx @guidepup/setup@0.29.3 install nvda

      - run: pnpm --filter tessera-learn build

      - run: pnpm exec playwright test -c tests/screen-reader/playwright.config.ts --project ${{ matrix.browser }}

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvda-phrases-${{ matrix.browser }}
          path: test-results/screen-reader/
          retention-days: 7
          if-no-files-found: ignore
