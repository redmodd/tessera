name: Screen reader

# Not a required check: screen readers on hosted runners can be flaky.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/screen-reader.yml
      - tests/screen-reader/**
      - tests/fixtures/screen-reader/**
      - packages/tessera-learn/src/**
      - packages/tessera-learn/styles/**
      - packages/tessera-learn/package.json
      - packages/tessera-learn/tsdown.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screen-reader:
    name: ${{ matrix.label }} (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        reader: [nvda, voiceover]
        browser: [chromium, firefox, webkit]
        exclude:
          # WebKit stands in for Safari, which is macOS-only.
          - { reader: nvda, browser: webkit }
          # VoiceOver in Firefox misreads text fields and sometimes ignores
          # clicks; NVDA covers Firefox.
          - { reader: voiceover, browser: firefox }
        include:
          - { reader: nvda, label: NVDA, os: windows-latest }
          - { reader: voiceover, label: VoiceOver, os: macos-15 }
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Screen readers need a headed browser, so skip Chromium's headless shell.
      - run: pnpm exec playwright install --no-shell ${{ matrix.browser }}

      # Grants the automation permissions VoiceOver needs.
      - if: runner.os == 'macOS'
        run: pnpm exec guidepup setup --ci

      # Downloads the screen reader build that the installed @guidepup/guidepup expects.
      - run: pnpm exec guidepup install ${{ matrix.reader }}

      - run: pnpm --filter tessera-learn build

      - run: pnpm exec playwright test -c tests/screen-reader/playwright.config.ts --project ${{ matrix.browser }}

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.reader }}-phrases-${{ matrix.browser }}
          path: test-results/screen-reader/
          retention-days: 7
          if-no-files-found: ignore
